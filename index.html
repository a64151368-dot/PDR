<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правда чи міф: безпека на дорозі</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#17191C;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;display:flex;font-family:Manrope,Arial,sans-serif;color:#17191C}
.side{width:480px;height:900px;box-sizing:border-box;padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between}
.head{display:flex;flex-direction:column;gap:18px}
.kicker{font-size:22px;font-weight:800}
h1{margin:0;font-family:Unbounded,Arial,sans-serif;font-weight:800;font-size:58px;line-height:1.08}
.theme{font-size:32px;font-weight:800;line-height:1.2}
.bottom{display:flex;flex-direction:column;gap:20px}
.task{font-size:27px;font-weight:800;line-height:1.25}
.nav{display:flex;justify-content:space-between;gap:12px;min-height:56px}
.nav button{min-height:56px;padding:0 24px;border:0;border-radius:12px;font:800 22px Manrope,Arial,sans-serif;cursor:pointer}
.nav button[hidden]{display:block;visibility:hidden}
.grid{width:1120px;height:900px;box-sizing:border-box;padding:44px;background:#2A2D31;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:24px}
.card{position:relative;min-height:0;perspective:1400px}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border-radius:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.cover{border:0;color:#17191C;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Manrope,Arial,sans-serif}
.bignum{font-family:Unbounded,Arial,sans-serif;font-weight:800;font-size:130px;line-height:1}
.tap{font-size:26px;font-weight:800}
.front{transform:rotateY(180deg);padding:24px 30px;display:flex;flex-direction:column;justify-content:space-between}
.btns{display:flex;gap:10px}
.close{min-height:56px;padding:0 20px;border:3px solid #17191C;border-radius:12px;background:transparent;color:#17191C;font:800 22px Manrope,Arial,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.num{font-family:Unbounded,Arial,sans-serif;font-weight:800;font-size:44px}
.show{min-height:56px;padding:0 24px;border:0;border-radius:12px;background:#17191C;color:#fff;font:800 22px Manrope,Arial,sans-serif;cursor:pointer}
.text{margin:0;font-size:30px;font-weight:700;line-height:1.22}
.slot{height:124px}
.answer{box-sizing:border-box;height:124px;background:#fff;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.line{display:flex;align-items:center;gap:12px}
.badge{font-family:Unbounded,Arial,sans-serif;font-size:20px;font-weight:800;padding:4px 12px;border-radius:8px;color:#fff}
.ref{font-size:18px;font-weight:800;color:#4A4F55}
.why{font-size:21px;font-weight:700;line-height:1.24}
</style>
</head>
<body>
<div id="stage"></div>
<script>
var road='<path d="M0 214 H400 V260 H0 Z" fill="#2A2D31"/><path d="M12 238 H62 M102 238 H152 M192 238 H242 M282 238 H332 M372 238 H400" stroke="#fff" stroke-width="6"/>';
var boards=[
{bg:'#F6B81C',fg:'#17191C',navBg:'#17191C',navFg:'#fff',theme:'1. Дрон над дорогою',
art:'<path d="M0 150 C90 118 170 170 400 126 V260 H0 Z" fill="#7A9A3A"/>'+road+'<rect x="312" y="112" width="12" height="62" fill="#5B3F22"/><circle cx="318" cy="94" r="42" fill="#3F6B2A"/><path d="M70 66 L170 66 M120 66 V90" stroke="#17191C" stroke-width="9" stroke-linecap="round"/><path d="M40 52 H100 M140 52 H200" stroke="#17191C" stroke-width="7" stroke-linecap="round"/><path d="M70 66 V52 M170 66 V52" stroke="#17191C" stroke-width="7"/><rect x="92" y="86" width="56" height="30" rx="10" fill="#17191C"/><circle cx="120" cy="101" r="7" fill="#F6B81C"/><path d="M216 30 q18 18 0 36 M238 18 q30 30 0 60" fill="none" stroke="#17191C" stroke-width="6" stroke-linecap="round"/>',
cards:[
['#FF9A76',0,'МКЧХ, поради для прифронту','Почув дрон — зупинись і зніми його на телефон, це допоможе військовим.','Одразу в міцне укриття. Жодних фото й відео.'],
['#7FD8BE',1,'Поради для прифронту','Ходити вулицею в навушниках небезпечно: можна не почути дрон або попередження.','На вулиці слух може врятувати. Навушники знімаємо.'],
['#8CC6FF',0,'МКЧХ','Під автомобілем можна надійно сховатися від дрона.','Авто не захищає і саме може стати ціллю. Шукай міцну споруду.'],
['#C9B2FF',1,'МКЧХ, поради для прифронту','Після вибуху не варто одразу бігти на місце удару: можливий повторний удар.','Спершу дзвінок 101, 102, 103. Допомагай лише без ризику для себе.']]},
{bg:'#B3261E',fg:'#fff',navBg:'#fff',navFg:'#17191C',theme:'2. Знахідки та міни',
art:'<path d="M0 150 C100 120 220 166 400 130 V260 H0 Z" fill="#E8A29C"/>'+road+'<rect x="192" y="120" width="16" height="96" fill="#5B3F22"/><path d="M200 18 L300 150 H100 Z" fill="#fff" stroke="#17191C" stroke-width="8" stroke-linejoin="round"/><path d="M200 62 V108" stroke="#17191C" stroke-width="16" stroke-linecap="round"/><circle cx="200" cy="130" r="9" fill="#17191C"/>',
cards:[
['#FFD24D',1,'ДСНС','Збитий дрон на дорозі не можна чіпати, навіть якщо він здається неробочим.','Зупинись, відійди щонайменше на 100 м тим самим шляхом, потім телефонуй 101 або 102.'],
['#FFB3D1',0,'Поради для водіїв','Кульок чи коробку посеред дороги можна відкинути ногою, щоб проїхали інші.','Це може бути міна, скинута з дрона. Не наближайся, телефонуй 101.'],
['#7FD8BE',0,'ДСНС, ЮНІСЕФ','Якщо дорога розбита, безпечніше обійти її полем або лісосмугою.','Поля й лісосмуги можуть бути заміновані. Лише знайомими дорогами.'],
['#FF9A76',1,'ЮНІСЕФ','Напис «Міни» фарбою на паркані — таке саме серйозне попередження, як офіційний знак.','За будь-який знак чи стрічку заходити не можна.']]},
{bg:'#1B57B0',fg:'#fff',navBg:'#fff',navFg:'#17191C',theme:'3. На дорозі щодня',
art:'<path d="M0 150 C100 120 220 166 400 130 V260 H0 Z" fill="#7FB2E8"/>'+road+'<circle cx="112" cy="166" r="48" fill="none" stroke="#fff" stroke-width="10"/><circle cx="290" cy="166" r="48" fill="none" stroke="#fff" stroke-width="10"/><path d="M112 166 L170 92 H258 L290 166 M170 92 L198 166 H112 M198 166 L258 92" fill="none" stroke="#F6B81C" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M170 92 L160 70 M142 68 H182 M258 92 L250 58 H286" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>',
cards:[
['#8CC6FF',1,'ПДР, п. 4.1','Якщо узбіччя немає, краєм проїзної частини треба йти назустріч транспорту.','Так ти бачиш машину, а водій бачить тебе.'],
['#FFD24D',0,'ПДР, п. 2.13','Скутер до 50 см³ можна водити з 14 років і без посвідчення водія.','Потрібні 16 років і посвідчення категорії A1.'],
['#C9B2FF',1,'ПДР, п. 6.6 а','Їздити велосипедом із несправним гальмом заборонено, навіть селом.','Спершу ремонт гальм, потім дорога.'],
['#FFB3D1',0,'КК України, ст. 114-2','Зняти військову колону і викласти в сторіз можна, якщо не писати назву села.','Поширювати дані про рух і розташування військ заборонено.']]}
];
var current=0,stage=document.getElementById('stage');
function render(){
  var b=boards[current],html='<div class="side" style="background:'+b.bg+';color:'+b.fg+'"><div class="head"><div class="kicker">Безпека на дорозі · 9 клас</div><h1>Правда<br>чи міф?</h1><div class="theme">'+b.theme+'</div></div><svg width="400" height="260" viewBox="0 0 400 260" aria-hidden="true">'+b.art+'</svg><div class="bottom"><div class="task">Напиши в чат номер і слово: правда або міф</div><div class="nav"><button id="prev" style="background:'+b.navBg+';color:'+b.navFg+'"'+(current==0?' hidden':'')+'>← Назад</button><button id="next" style="background:'+b.navBg+';color:'+b.navFg+'"'+(current==2?' hidden':'')+'>Далі →</button></div></div></div><div class="grid">';
  b.cards.forEach(function(c,i){
    html+='<div class="card"><div class="inner"><button class="face cover" style="background:'+c[0]+'"><span class="bignum">'+(i+1)+'</span><span class="tap">Натисни, щоб відкрити</span></button><div class="face front" style="background:'+c[0]+'" inert><div><div class="top"><div class="num">'+(i+1)+'</div><div class="btns"><button class="show" aria-expanded="false">Відповідь</button><button class="close">Закрити</button></div></div><p class="text">'+c[3]+'</p></div><div class="slot"><div class="answer" hidden style="display:none"><div class="line"><span class="badge" style="background:'+(c[1]?'#1B57B0':'#B3261E')+'">'+(c[1]?'ПРАВДА':'МІФ')+'</span><span class="ref">'+c[2]+'</span></div><div class="why">'+c[4]+'</div></div></div></div></div></div>';
  });
  stage.innerHTML=html+'</div>';
  function closeCard(card){
    card.classList.remove('open');
    card.querySelector('.front').inert=true;
    card.querySelector('.cover').inert=false;
    var a=card.querySelector('.answer'),b=card.querySelector('.show');
    setTimeout(function(){if(!card.classList.contains('open')){a.style.display='none';b.textContent='Відповідь';b.setAttribute('aria-expanded',false);}},300);
  }
  stage.querySelectorAll('.card').forEach(function(card){
    card.querySelector('.cover').onclick=function(){
      stage.querySelectorAll('.card.open').forEach(closeCard);
      card.classList.add('open');
      card.querySelector('.front').inert=false;
      card.querySelector('.cover').inert=true;
    };
    card.querySelector('.close').onclick=function(){closeCard(card);};
  });
  stage.querySelectorAll('.show').forEach(function(btn){
    btn.onclick=function(){
      var a=btn.closest('.card').querySelector('.answer'),open=a.style.display=='none';
      a.style.display=open?'flex':'none';
      btn.textContent=open?'Сховати':'Відповідь';
      btn.setAttribute('aria-expanded',open);
    };
  });
  document.getElementById('prev').onclick=function(){if(current>0){current--;render();}};
  document.getElementById('next').onclick=function(){if(current<2){current++;render();}};
}
function fit(){
  var s=Math.min(innerWidth/1600,innerHeight/900);
  stage.style.transform='translate('+(innerWidth-1600*s)/2+'px,'+(innerHeight-900*s)/2+'px) scale('+s+')';
}
addEventListener('resize',fit);render();fit();
</script>
</body>
</html>
